# 这个文件不会被读取，仅作参考。
#
# Mio 用 config=no 启动 libmpv，并在 MpvPlayer.RequiredOptions 里逐条设置选项，
# 因此既不读用户全局 mpv.conf，也不读这个文件——它不随构建复制到输出目录。
# 修改这里不会影响运行行为；真正生效的位置是 Player/MpvPlayer.cs。
#
# 保留它是为了把「预期的本地默认值」和「将来要开的高级开关」记在一处。
# 下列内容必须与 MpvPlayer.RequiredOptions 保持一致。

vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
d3d11-output-mode=composition
hwdec=d3d11va
target-colorspace-hint=auto
input-default-bindings=no
input-vo-keyboard=no
keep-open=yes

# 留给后续设置 UI 的高级输出/音频选项：
# d3d11-output-format=auto
# d3d11-output-csp=auto
# audio-spdif=ac3,eac3,dts,dts-hd,truehd
# ao=wasapi
# audio-exclusive=no
